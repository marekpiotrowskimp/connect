name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Package (macOS universal binary + .app bundle)
        if: matrix.os == 'macos-latest'
        run: make package-darwin

      - name: Cross-compile (Windows GUI build)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-H=windowsgui" -o bin/connect-windows-amd64.exe ./cmd/connect
